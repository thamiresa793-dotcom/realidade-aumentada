<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Minha Experiência AR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        /* Tela inicial */
        #inicio {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px;
            text-align: center;

            background:
                radial-gradient(circle at top, #333 0%, #111 55%, #000 100%);

            color: white;
        }

        #inicio h1 {
            margin: 0 0 15px;
            font-size: 32px;
        }

        #inicio p {
            max-width: 340px;
            margin: 0 0 30px;
            font-size: 17px;
            line-height: 1.5;
            color: #ddd;
        }

        #botaoIniciar {
            border: none;
            border-radius: 14px;
            padding: 16px 30px;

            font-size: 18px;
            font-weight: bold;

            background: white;
            color: #111;

            cursor: pointer;
        }

        #botaoIniciar:active {
            transform: scale(0.97);
        }

        /* Área da câmera */
        #experiencia {
            position: fixed;
            inset: 0;
            display: none;
            background: black;
        }

        #camera {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* Elementos sobre a câmera */
        #interface {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding:
                max(25px, env(safe-area-inset-top))
                20px
                max(25px, env(safe-area-inset-bottom))
                20px;

            pointer-events: none;
        }

        #titulo {
            align-self: center;

            padding: 10px 18px;
            border-radius: 20px;

            background: rgba(0, 0, 0, 0.55);
            color: white;

            font-size: 16px;
        }

        #mensagem {
            align-self: center;

            margin-bottom: 20px;

            padding: 12px 18px;
            border-radius: 12px;

            background: rgba(0, 0, 0, 0.65);
            color: white;

            font-size: 14px;
            text-align: center;
        }

        #erro {
            display: none;

            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 30px;

            padding: 16px;
            border-radius: 12px;

            background: rgba(180, 0, 0, 0.9);
            color: white;

            text-align: center;
            z-index: 20;
        }
    </style>
</head>

<body>

    <!-- TELA INICIAL -->
    <div id="inicio">

        <h1>Minha Experiência AR</h1>

        <p>
            Prepare-se para uma experiência de realidade aumentada.
            Toque no botão abaixo para começar.
        </p>

        <button id="botaoIniciar">
            Iniciar experiência
        </button>

    </div>


    <!-- EXPERIÊNCIA -->
    <div id="experiencia">

        <!-- Câmera -->
        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <!-- Interface sobre a câmera -->
        <div id="interface">

            <div id="titulo">
                REALIDADE AUMENTADA
            </div>

            <div id="mensagem">
                Câmera ativada
            </div>

        </div>

    </div>


    <!-- MENSAGEM DE ERRO -->
    <div id="erro">
        Não foi possível acessar a câmera.
        Verifique se você autorizou o uso da câmera.
    </div>


    <script>

        const botaoIniciar = document.getElementById("botaoIniciar");
        const inicio = document.getElementById("inicio");
        const experiencia = document.getElementById("experiencia");
        const camera = document.getElementById("camera");
        const erro = document.getElementById("erro");

        async function iniciarExperiencia() {

            try {

                // Solicita acesso à câmera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: {
                            ideal: "environment"
                        }
                    },
                    audio: false
                });

                // Coloca a câmera na tela
                camera.srcObject = stream;

                // Esconde a tela inicial
                inicio.style.display = "none";

                // Mostra a experiência
                experiencia.style.display = "block";

            } catch (error) {

                console.error(error);

                erro.style.display = "block";

            }
        }

        botaoIniciar.addEventListener(
            "click",
            iniciarExperiencia
        );

    </script>

</body>
</html>
